name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Build installer
        shell: pwsh
        run: .\build-installer.ps1
      - name: Self-test Korean and English
        shell: pwsh
        run: |
          $tests = @('ko', 'en')
          foreach ($lang in $tests) {
            $process = Start-Process -FilePath .\dist\CodexAccountSwitcher.exe -ArgumentList '--self-test','--lang',$lang -PassThru -NoNewWindow
            $process.WaitForExit()
            if ($process.ExitCode -ne 0) { throw "Self-test failed for $lang" }
          }
      - uses: actions/upload-artifact@v4
        with:
          name: CodexAccountSwitcher-Setup
          path: dist/CodexAccountSwitcher-Setup.exe

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: windows
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: CodexAccountSwitcher-Setup
          path: dist
      - name: Publish tagged release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create $env:GITHUB_REF_NAME .\dist\CodexAccountSwitcher-Setup.exe --generate-notes --title $env:GITHUB_REF_NAME
